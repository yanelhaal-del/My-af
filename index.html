<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>حلقة الفجر أ. أسماء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-deep:#132420;
    --teal:#1E3B36;
    --teal-soft:#2C4F47;
    --sand:#F4EFE1;
    --sand-card:#FBF8F0;
    --gold:#C6A15B;
    --gold-soft:#E4D3A7;
    --ink:#20302C;
    --ink-soft:#5E6E68;
    --line:#E3DBC6;
    --done:#7C9A7E;
    --review:#5C7FA0;
    --absent:#B97A67;
    --absent-soft:#EAD9D2;
    --radius:18px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ===== Header band ===== */
  .hero{
    width:100%;
    background:
      radial-gradient(circle at 15% 20%, rgba(198,161,91,0.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(198,161,91,0.08), transparent 50%),
      linear-gradient(180deg, var(--teal-deep), var(--teal));
    padding:34px 20px 46px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    bottom:0; left:0; right:0;
    height:28px;
    background:var(--sand);
    border-radius:50% 50% 0 0 / 100% 100% 0 0;
    transform:scale(1.4,1);
  }
  .hero .kicker{
    color:var(--gold-soft);
    font-size:13px;
    letter-spacing:2px;
    font-weight:500;
    opacity:0.85;
    margin-bottom:10px;
  }
  .hero h1{
    font-family:'Amiri', serif;
    color:#FBF8F0;
    font-size:38px;
    margin:0 0 8px;
    font-weight:700;
  }
  .hero p{
    color:var(--gold-soft);
    font-size:14.5px;
    margin:0;
    opacity:0.9;
  }
  .date-line{
    color:var(--gold-soft);
    font-size:13px;
    margin:0;
    opacity:0.75;
    font-weight:500;
  }
  .arc-motif{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:16px;
  }
  .arc-motif span{
    width:5px;height:5px;border-radius:50%;
    background:var(--gold);
    opacity:0.6;
  }

  /* ===== Main container ===== */
  .wrap{
    width:100%;
    max-width:520px;
    padding:0 18px 40px;
    margin-top:-24px;
    position:relative;
    z-index:2;
  }
  @media (min-width:860px){
    .wrap{
      max-width:920px;
      display:grid;
      grid-template-columns:1fr 300px;
      align-items:start;
      gap:20px;
    }
  }
  .side-col{
    margin-top:0;
  }
  @media (max-width:859.98px){
    .side-col{margin-top:18px;}
  }

  .card{
    background:var(--sand-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px;
    box-shadow:0 10px 30px -14px rgba(19,36,32,0.18);
  }

  .card + .card{margin-top:18px;}

  .card.locked{
    opacity:0.65;
  }
  .card.locked input[type="text"]{
    background:#F1EEE3;
    cursor:not-allowed;
  }
  .card.locked .btn-primary{
    background:var(--ink-soft);
    cursor:not-allowed;
  }
  .hint.locked-hint{
    color:var(--absent);
    font-weight:500;
  }

  .card-title{
    font-size:14px;
    font-weight:700;
    color:var(--teal);
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-title::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--gold);
    flex-shrink:0;
  }

  /* ===== Form ===== */
  .form-row{
    display:flex;
    gap:10px;
  }
  input[type="text"]{
    flex:1;
    padding:13px 16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:#fff;
    font-family:'Tajawal', sans-serif;
    font-size:15.5px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
    min-width:0;
  }
  input[type="text"]::placeholder{color:#A7A190;}
  input[type="text"]:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(198,161,91,0.18);
  }

  .btn{
    border:none;
    border-radius:12px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(0.96);}

  .btn-primary{
    background:var(--teal);
    color:#FBF8F0;
    padding:0 22px;
    font-size:15px;
    white-space:nowrap;
  }
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-primary:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:10px 2px 0;
  }
  .my-status{
    margin-top:14px;
    background:linear-gradient(135deg, rgba(198,161,91,0.12), rgba(198,161,91,0.05));
    border:1.5px solid var(--gold-soft);
    border-radius:14px;
    padding:14px 16px;
  }
  .my-status .ms-title{
    font-size:14px;
    font-weight:700;
    color:var(--teal);
    margin:0 0 4px;
  }
  .my-status .ms-detail{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
  }

  .row.own{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(198,161,91,0.25);
  }
  .row.own .bead{
    background:var(--gold);
    color:#fff;
  }

  /* ===== List ===== */
  .list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .count-pill{
    background:var(--teal);
    color:var(--gold-soft);
    font-size:12.5px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
  }

  .string{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .string::before{
    content:"";
    position:absolute;
    right:20px;
    top:6px;
    bottom:6px;
    width:1.5px;
    background:repeating-linear-gradient(to bottom, var(--gold-soft) 0, var(--gold-soft) 4px, transparent 4px, transparent 9px);
    opacity:0.7;
  }

  .row{
    position:relative;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px 14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    animation:appear .28s ease;
  }
  @media (max-width:380px){
    .row-name{flex:1 1 100%;}
    .checks-group{flex:1 1 100%; justify-content:flex-end;}
  }
  @keyframes appear{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .bead{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:50%;
    background:var(--gold-soft);
    color:var(--teal-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:14px;
    z-index:1;
    border:2px solid var(--sand-card);
  }
  .row.done .bead{
    background:var(--done);
    color:#fff;
  }

  .row-name{
    flex:1;
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  .row.done .row-name{
    color:var(--ink-soft);
  }

  .checks-group{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .check-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
    cursor:pointer;
    user-select:none;
  }
  .check-label{
    font-size:11px;
    color:var(--ink-soft);
    display:inline;
    white-space:nowrap;
  }

  input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:24px;height:24px;
    border-radius:8px;
    border:2px solid var(--line);
    background:#fff;
    cursor:pointer;
    position:relative;
    flex-shrink:0;
    transition:border-color .15s ease, background .15s ease;
  }
  input[type="checkbox"].chk-done:checked{
    background:var(--done);
    border-color:var(--done);
  }
  input[type="checkbox"].chk-review:checked{
    background:var(--review);
    border-color:var(--review);
  }
  input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    right:7px; top:3px;
    width:6px; height:11px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(35deg);
  }
  input[type="checkbox"]:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }

  .empty{
    text-align:center;
    padding:30px 10px 10px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .ic{
    font-size:26px;
    margin-bottom:8px;
    opacity:0.6;
  }

  /* ===== Reset ===== */
  .reset-zone{
    text-align:center;
    margin-top:26px;
  }
  .trigger-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
  }
  .teacher-trigger{
    width:40px;
    height:40px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:50%;
  }
  .teacher-trigger:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
  .teacher-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--line);
    opacity:0.7;
    transition:opacity .15s ease, background .15s ease, transform .15s ease;
  }
  .teacher-trigger:hover .teacher-dot,
  .teacher-trigger:focus-visible .teacher-dot{
    background:var(--gold);
    opacity:1;
    transform:scale(1.4);
  }

  .confirm-box{
    display:none;
    margin-top:12px;
    background:#FBF1EF;
    border:1px solid #E2C9C4;
    border-radius:12px;
    padding:14px;
    font-size:13.5px;
    color:#7A342B;
  }
  .confirm-box.show{display:block;}
  .confirm-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    justify-content:center;
  }
  .btn-confirm-yes{
    background:#A2453A;
    color:#fff;
    padding:8px 16px;
    font-size:13px;
  }
  .btn-confirm-no{
    background:#fff;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:8px 16px;
    font-size:13px;
  }

  /* ===== Absence sidebar ===== */
  .absent-card{
    background:var(--sand-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 10px 30px -14px rgba(19,36,32,0.18);
  }
  .absent-card .card-title::before{
    background:var(--absent);
  }
  .absent-count-pill{
    background:var(--absent);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:3px 11px;
    border-radius:999px;
  }
  .absent-form{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:14px;
  }
  .absent-form input[type="text"]{
    font-size:14.5px;
    padding:11px 14px;
  }
  .btn-absent{
    background:var(--absent);
    color:#fff;
    padding:11px 16px;
    font-size:13.5px;
    white-space:nowrap;
    width:100%;
  }
  .btn-absent:hover{filter:brightness(1.08);}

  .absent-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .absent-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border:1px solid var(--absent-soft);
    border-radius:12px;
    padding:9px 12px;
    animation:appear .28s ease;
  }
  .absent-bead{
    flex-shrink:0;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--absent-soft);
    color:#7A3F30;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    font-size:12px;
  }
  .absent-name-wrap{
    flex:1;
    min-width:0;
  }
  .absent-name{
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    overflow-wrap:anywhere;
  }
  .absent-reason{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
    overflow-wrap:anywhere;
  }
  .absent-remove{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:15px;
    line-height:1;
    cursor:pointer;
  }
  .absent-remove:hover{
    background:var(--absent-soft);
    color:#7A3F30;
  }
  .empty-small{
    text-align:center;
    padding:16px 6px 4px;
    color:var(--ink-soft);
    font-size:13px;
  }

  .footer-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:24px;
    opacity:0.75;
  }

  @media (prefers-reduced-motion: reduce){
    .row{animation:none;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="kicker">تسجيل الحضور والغياب</div>
  <h1>حلقة الفجر أ. أسماء</h1>
  <p class="date-line" id="dateLine"></p>
  <div class="arc-motif"><span></span><span></span><span></span><span></span><span></span></div>
</div>

<div class="wrap">

  <div class="main-col">

  <div class="card" id="registrationCard">
    <div class="form-row">
      <input type="text" id="nameInput" placeholder="اكتبي اسم الطالبة هنا" maxlength="40" autocomplete="off">
      <button class="btn btn-primary" id="registerBtn">تسجيل</button>
    </div>
    <p class="hint" id="regHint">يحدَّد دور الطالبة تلقائيًا حسب ترتيب التسجيل</p>
    <div class="my-status" id="myStatus" style="display:none;"></div>
  </div>

  <div class="card">
    <div class="list-header">
      <p class="card-title" style="margin:0;">قائمة الطالبات</p>
      <span class="count-pill" id="countPill">0 طالبة</span>
    </div>

    <div id="listArea">
      <div class="empty" id="emptyState">
        <div class="ic">📖</div>
        لم تُسجَّل أي طالبة بعد
      </div>
      <div class="string" id="studentsString"></div>
    </div>
  </div>

  <div class="reset-zone">
    <div class="trigger-row">
      <div class="teacher-trigger" id="resetBtn" role="button" tabindex="0" aria-label="خيارات إعادة التعيين (للمعلمة)">
        <span class="teacher-dot"></span>
      </div>
    </div>
    <div class="confirm-box" id="confirmBox">
      سيتم مسح جميع الأسماء وحالات التسميع والمراجعة والغياب نهائيًا. هل أنتِ متأكدة؟
      <div class="confirm-actions">
        <button class="btn btn-confirm-yes" id="confirmYes">نعم، إعادة التعيين</button>
        <button class="btn btn-confirm-no" id="confirmNo">تراجع</button>
      </div>
    </div>
  </div>

  <p class="footer-note">جعل الله القرآن ربيع قلوبكنّ 🌿</p>

  </div>

  <aside class="side-col">
    <div class="absent-card">
      <div class="list-header">
        <p class="card-title" style="margin:0;">الغائبات</p>
        <span class="absent-count-pill" id="absentCountPill">0</span>
      </div>
      <div class="absent-form">
        <input type="text" id="absentInput" placeholder="اسم الطالبة الغائبة" maxlength="40" autocomplete="off">
        <input type="text" id="absentReasonInput" placeholder="سبب الغياب (اختياري)" maxlength="60" autocomplete="off">
        <button class="btn btn-absent" id="absentBtn">تسجيل</button>
      </div>
      <div id="absentListArea">
        <div class="empty-small" id="absentEmptyState">لا توجد غائبات اليوم</div>
        <div class="absent-list" id="absentList"></div>
      </div>
    </div>
  </aside>

</div>

<script>
  // ====== إعدادات مكان الحفظ المشترك ======
  // عدّلي القيمة التالية بمعرّف الـ Blob الذي حصلتِ عليه من jsonblob.com
  const JSONBLOB_ID = '019fd319-cf24-7410-bd96-580d4d3aa3ee';
  const JSONBLOB_URL = 'https://jsonblob.com/api/jsonBlob/' + JSONBLOB_ID;
  // ==========================================

  const STORAGE_KEY = 'halqa-fajr-state';
  const TEN_HOURS_MS = 10 * 60 * 60 * 1000;

  // ====== نافذة فتح تسجيل الأسماء (٤:٠٠ - ٥:٣٠ صباحًا بتوقيت مكة المكرمة) ======
  const REG_OPEN_MINUTES = 4 * 60;        // 4:00 صباحًا
  const REG_CLOSE_MINUTES = 5 * 60 + 30;  // 5:30 صباحًا
  const REG_OPEN_HINT = 'يحدَّد دور الطالبة تلقائيًا حسب ترتيب التسجيل';
  const REG_CLOSED_HINT = 'تسجيل الأسماء مغلق الآن — يُفتح يوميًا من الساعة ٤:٠٠ إلى ٥:٣٠ صباحًا بتوقيت مكة المكرمة';

  function getMeccaMinutesNow(){
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Riyadh',
      hour: 'numeric',
      minute: 'numeric',
      hour12: false
    }).formatToParts(new Date());
    let hour = 0, minute = 0;
    parts.forEach(p => {
      if(p.type === 'hour') hour = parseInt(p.value, 10);
      if(p.type === 'minute') minute = parseInt(p.value, 10);
    });
    return hour * 60 + minute;
  }

  function isRegistrationOpen(){
    const minutesNow = getMeccaMinutesNow();
    return minutesNow >= REG_OPEN_MINUTES && minutesNow < REG_CLOSE_MINUTES;
  }

  function updateRegistrationLock(){
    const open = isRegistrationOpen();
    nameInput.disabled = !open;
    registerBtn.disabled = !open;
    registrationCard.classList.toggle('locked', !open);
    regHint.textContent = open ? REG_OPEN_HINT : REG_CLOSED_HINT;
    regHint.classList.toggle('locked-hint', !open);
  }
  // ================================================================

  function defaultState(){
    return { students: [], nextId: 1, absentees: [], nextAbsentId: 1, dayStartTime: null };
  }

  let state = defaultState();
  let myId = null;

  const nameInput = document.getElementById('nameInput');
  const registerBtn = document.getElementById('registerBtn');
  const registrationCard = document.getElementById('registrationCard');
  const regHint = document.getElementById('regHint');
  const myStatus = document.getElementById('myStatus');
  const studentsString = document.getElementById('studentsString');
  const emptyState = document.getElementById('emptyState');
  const countPill = document.getElementById('countPill');
  const resetBtn = document.getElementById('resetBtn');
  const confirmBox = document.getElementById('confirmBox');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');

  const absentInput = document.getElementById('absentInput');
  const absentReasonInput = document.getElementById('absentReasonInput');
  const absentBtn = document.getElementById('absentBtn');
  const absentList = document.getElementById('absentList');
  const absentEmptyState = document.getElementById('absentEmptyState');
  const absentCountPill = document.getElementById('absentCountPill');

  async function saveState(){
    try{
      await fetch(JSONBLOB_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(state)
      });
    }catch(e){
      console.error('خطأ في حفظ البيانات', e);
    }
  }

  async function refreshState(){
    try{
      const res = await fetch(JSONBLOB_URL, {
        headers: { 'Accept': 'application/json' }
      });
      if(res.ok){
        const val = await res.json();
        if(val && typeof val === 'object'){
          state = Object.assign(defaultState(), val, {
            students: val.students || [],
            absentees: val.absentees || []
          });
        }
      }
    }catch(e){
      console.error('خطأ في قراءة البيانات', e);
    }
  }

  const MY_ID_KEY = 'halqa-my-id';

  async function loadMyId(){
    try{
      const val = localStorage.getItem(MY_ID_KEY);
      if(val !== null){
        myId = JSON.parse(val);
      }
    }catch(e){
      // لا يوجد رقم محفوظ لهذا المتصفح بعد
    }
  }

  async function saveMyId(id){
    try{
      localStorage.setItem(MY_ID_KEY, JSON.stringify(id));
    }catch(e){
      console.error('تعذّر حفظ رقمك الخاص', e);
    }
  }

  function renderMyStatus(){
    if(myId === null){
      myStatus.style.display = 'none';
      return;
    }
    const idx = state.students.findIndex(s => s.id === myId);
    if(idx === -1){
      myStatus.style.display = 'none';
      return;
    }
    const me = state.students[idx];
    const before = state.students.slice(0, idx);
    let detail;
    if(before.length === 0){
      detail = 'أنتِ أول من سجّل اليوم 🌿';
    } else {
      const names = before.map(s => s.name).join('، ');
      detail = 'سجّلت قبلك: ' + names;
    }
    myStatus.innerHTML = '';
    const title = document.createElement('p');
    title.className = 'ms-title';
    title.textContent = 'دورك رقم ' + (idx + 1) + ' — ' + me.name;
    const det = document.createElement('p');
    det.className = 'ms-detail';
    det.textContent = detail;
    myStatus.appendChild(title);
    myStatus.appendChild(det);
    myStatus.style.display = 'block';
  }

  function render(){
    studentsString.innerHTML = '';
    if(state.students.length === 0){
      emptyState.style.display = 'block';
      studentsString.style.display = 'none';
    } else {
      emptyState.style.display = 'none';
      studentsString.style.display = 'flex';
      state.students.forEach((s, idx) => {
        const row = document.createElement('div');
        row.className = 'row' + (s.done ? ' done' : '') + (s.id === myId ? ' own' : '');

        const bead = document.createElement('div');
        bead.className = 'bead';
        bead.textContent = idx + 1;

        const nameEl = document.createElement('div');
        nameEl.className = 'row-name';
        nameEl.textContent = s.name;

        const checksGroup = document.createElement('div');
        checksGroup.className = 'checks-group';

        // تسميع
        const doneWrap = document.createElement('label');
        doneWrap.className = 'check-wrap';
        const doneLabel = document.createElement('span');
        doneLabel.className = 'check-label';
        doneLabel.textContent = 'تسميع';
        const doneBox = document.createElement('input');
        doneBox.type = 'checkbox';
        doneBox.className = 'chk-done';
        doneBox.checked = s.done;
        doneBox.setAttribute('aria-label', 'تأشير حالة التسميع لـ ' + s.name);
        doneBox.addEventListener('change', async () => {
          const checked = doneBox.checked;
          await refreshState();
          const target = state.students.find(x => x.id === s.id);
          if(target) target.done = checked;
          await saveState();
          render();
        });
        doneWrap.appendChild(doneLabel);
        doneWrap.appendChild(doneBox);

        // مراجعة
        const reviewWrap = document.createElement('label');
        reviewWrap.className = 'check-wrap';
        const reviewLabel = document.createElement('span');
        reviewLabel.className = 'check-label';
        reviewLabel.textContent = 'مراجعة';
        const reviewBox = document.createElement('input');
        reviewBox.type = 'checkbox';
        reviewBox.className = 'chk-review';
        reviewBox.checked = s.reviewed;
        reviewBox.setAttribute('aria-label', 'تأشير حالة المراجعة لـ ' + s.name);
        reviewBox.addEventListener('change', async () => {
          const checked = reviewBox.checked;
          await refreshState();
          const target = state.students.find(x => x.id === s.id);
          if(target) target.reviewed = checked;
          await saveState();
          render();
        });
        reviewWrap.appendChild(reviewLabel);
        reviewWrap.appendChild(reviewBox);

        checksGroup.appendChild(doneWrap);
        checksGroup.appendChild(reviewWrap);

        row.appendChild(bead);
        row.appendChild(nameEl);
        row.appendChild(checksGroup);
        studentsString.appendChild(row);
      });
    }
    countPill.textContent = state.students.length + ' طالبة';
    renderMyStatus();
  }

  async function performReset(){
    state = defaultState();
    await saveState();
    myId = null;
    await saveMyId(null);
    render();
    renderAbsentees();
  }

  async function checkAutoReset(){
    if(state.dayStartTime !== null && (Date.now() - state.dayStartTime) >= TEN_HOURS_MS){
      await performReset();
    }
  }

  async function registerStudent(){
    if(!isRegistrationOpen()){
      updateRegistrationLock();
      return;
    }
    const name = nameInput.value.trim();
    if(!name) {
      nameInput.focus();
      return;
    }
    registerBtn.disabled = true;
    await refreshState();
    if(state.dayStartTime === null){
      state.dayStartTime = Date.now();
    }
    const newId = state.nextId++;
    state.students.push({ id: newId, name: name, done: false, reviewed: false });
    await saveState();
    myId = newId;
    await saveMyId(newId);
    nameInput.value = '';
    render();
    registerBtn.disabled = false;
    nameInput.focus();
  }

  registerBtn.addEventListener('click', registerStudent);
  nameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      registerStudent();
    }
  });

  function renderAbsentees(){
    absentList.innerHTML = '';
    if(state.absentees.length === 0){
      absentEmptyState.style.display = 'block';
      absentList.style.display = 'none';
    } else {
      absentEmptyState.style.display = 'none';
      absentList.style.display = 'flex';
      state.absentees.forEach((a, idx) => {
        const row = document.createElement('div');
        row.className = 'absent-row';

        const bead = document.createElement('div');
        bead.className = 'absent-bead';
        bead.textContent = idx + 1;

        const nameWrap = document.createElement('div');
        nameWrap.className = 'absent-name-wrap';

        const nameEl = document.createElement('div');
        nameEl.className = 'absent-name';
        nameEl.textContent = a.name;
        nameWrap.appendChild(nameEl);

        if(a.reason){
          const reasonEl = document.createElement('div');
          reasonEl.className = 'absent-reason';
          reasonEl.textContent = a.reason;
          nameWrap.appendChild(reasonEl);
        }

        const removeBtn = document.createElement('button');
        removeBtn.className = 'absent-remove';
        removeBtn.textContent = '×';
        removeBtn.setAttribute('aria-label', 'حذف ' + a.name + ' من قائمة الغياب');
        removeBtn.addEventListener('click', async () => {
          await refreshState();
          state.absentees = state.absentees.filter(x => x.id !== a.id);
          await saveState();
          renderAbsentees();
        });

        row.appendChild(bead);
        row.appendChild(nameWrap);
        row.appendChild(removeBtn);
        absentList.appendChild(row);
      });
    }
    absentCountPill.textContent = state.absentees.length;
  }

  async function registerAbsent(){
    const name = absentInput.value.trim();
    const reason = absentReasonInput.value.trim();
    if(!name){
      absentInput.focus();
      return;
    }
    absentBtn.disabled = true;
    await refreshState();
    if(state.dayStartTime === null){
      state.dayStartTime = Date.now();
    }
    state.absentees.push({ id: state.nextAbsentId++, name: name, reason: reason });
    await saveState();
    absentInput.value = '';
    absentReasonInput.value = '';
    renderAbsentees();
    absentBtn.disabled = false;
    absentInput.focus();
  }

  absentBtn.addEventListener('click', registerAbsent);
  absentInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      registerAbsent();
    }
  });
  absentReasonInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      e.preventDefault();
      registerAbsent();
    }
  });

  function openConfirm(){
    confirmBox.classList.add('show');
    resetBtn.style.visibility = 'hidden';
  }
  resetBtn.addEventListener('click', openConfirm);
  resetBtn.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      openConfirm();
    }
  });
  confirmNo.addEventListener('click', () => {
    confirmBox.classList.remove('show');
    resetBtn.style.visibility = 'visible';
  });
  confirmYes.addEventListener('click', async () => {
    await performReset();
    confirmBox.classList.remove('show');
    resetBtn.style.visibility = 'visible';
  });

  const dateLine = document.getElementById('dateLine');

  function updateDate(){
    const now = new Date();
    const formatted = now.toLocaleDateString('ar', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });
    dateLine.textContent = formatted;
  }

  async function pollForUpdates(){
    await refreshState();
    await checkAutoReset();
    render();
    renderAbsentees();
    updateRegistrationLock();
  }

  async function init(){
    await loadMyId();
    await refreshState();
    await checkAutoReset();
    render();
    renderAbsentees();
    updateDate();
    updateRegistrationLock();
    setInterval(updateDate, 60 * 1000);
    setInterval(updateRegistrationLock, 20 * 1000);
    setInterval(pollForUpdates, 2000);
  }

  init();
</script>

</body>
</html>
